<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>像素风 · 厨房闯关记</title>
<style>
@font-face { font-family: 'Fusion Pixel 12'; src: url('../../assets/fonts/fusion-pixel-12.woff2') format('woff2'); font-display: block; }
@font-face { font-family: 'Press Start 2P'; src: url('../../assets/fonts/PressStart2P-Regular.ttf') format('truetype'); font-display: block; }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; width: 1920px; height: 1080px; image-rendering: pixelated; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { boot } from '../../lib/core.js';
import { buildFilm } from '../../kits/pixel/kit.js';
// 新的镜头表：厨房新手村（用 examples/kits/pixel 的零件库，只写镜头表）
const SPEC = { kit: 'pixel', stage: 'COOK', shots: [
  { type: 'title', seconds: 2.6, text: '厨房闯关记', sub: '从泡面到三菜一汤' },
  { type: 'run', seconds: 2.2, text: '第一关：洗菜切菜', sub: '新手村出发' },
  { type: 'dialog', seconds: 2.8, speaker: '外婆', text: '火别开太大，先热锅再放油' },
  { type: 'items', seconds: 2.6, items: ['热锅', '凉油', '少盐'], text: '收集三件法宝' },
  { type: 'chest', seconds: 2.6, text: '解锁：番茄炒蛋', sub: '第一道菜出锅' },
  { type: 'ending', seconds: 2.4, text: '关注我', sub: '下一关：红烧肉' },
] };
const all = JSON.stringify(SPEC);
await boot({ width: 1920, height: 1080, fps: 30, fonts: [['12px "Fusion Pixel 12"', all + '像素冒险'], ['8px "Press Start 2P"', 'STAGE COOK 0123456789 PRESS START LEVEL UP']] },
  async () => buildFilm(SPEC, document.getElementById('c')));
</script></body></html>

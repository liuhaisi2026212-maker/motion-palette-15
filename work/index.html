<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十五画境工作台</title>
<style>
:root { --bg:#f3f1ec; --panel:#fff; --ink:#1b1a18; --muted:#6f6b63; --line:#e2ddd4; --accent:#e8553d; --ok:#2f8f5b; --warn:#b26b00; --stage:#0c0c0c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121212; --panel:#1c1c1c; --ink:#eeeae3; --muted:#9b968d; --line:#302d29; --accent:#ff6a50; --ok:#5cc28a; --warn:#e8a54a; } }
:root[data-theme="dark"] { --bg:#121212; --panel:#1c1c1c; --ink:#eeeae3; --muted:#9b968d; --line:#302d29; --accent:#ff6a50; --ok:#5cc28a; --warn:#e8a54a; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
header { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; padding:16px 18px 4px; }
header h1 { margin:0; font-size:20px; }
header span { color:var(--muted); font-size:13px; }
.layout { display:grid; grid-template-columns: 230px minmax(0,1fr) 360px; gap:14px; padding:10px 18px 24px; align-items:start; }
@media (max-width:1180px) { .layout { grid-template-columns: 1fr; padding:10px 16px 24px; } }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
.styles { display:grid; gap:8px; max-height:82vh; overflow:auto; }
@media (max-width:1180px) { .styles { grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); max-height:none; } }
.sty { display:flex; gap:8px; align-items:center; padding:6px; border-radius:10px; border:1px solid transparent; cursor:pointer; background:none; color:inherit; font:inherit; text-align:left; }
.sty img { width:72px; height:40px; object-fit:cover; border-radius:6px; flex:none; background:#000; }
.sty b { display:block; font-size:13px; }
.sty small { color:var(--muted); font-size:11px; }
.sty.on { border-color:var(--accent); }
.sty[disabled] { opacity:.45; cursor:default; }
.stage { position:relative; width:100%; aspect-ratio:16/9; background:var(--stage); border-radius:10px; overflow:hidden; }
.stage iframe { position:absolute; left:0; top:0; width:1920px; height:1080px; border:0; transform-origin:0 0; pointer-events:none; }
.stage .veil { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; background:rgba(0,0,0,.55); font-size:15px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
button, select { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:9px; padding:7px 12px; cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
button:disabled { opacity:.5; cursor:default; }
input[type=range] { flex:1; min-width:140px; accent-color:var(--accent); }
.time { color:var(--muted); font-variant-numeric:tabular-nums; min-width:84px; text-align:right; font-size:13px; }
.about { color:var(--muted); font-size:13px; margin:10px 2px 0; }
.bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:8px; display:none; }
.bar.on { display:block; }
.bar i { display:block; height:100%; width:0; background:var(--accent); }
.msg { font-size:13px; margin-top:8px; white-space:pre-line; }
.msg.err { color:var(--accent); } .msg.warn { color:var(--warn); } .msg.ok { color:var(--ok); }
.tabs { display:flex; gap:6px; margin-bottom:10px; }
.tabs button.on { border-color:var(--accent); }
.f { margin-bottom:10px; }
.f label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
.f input[type=text] { width:100%; font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
.f .multi { display:grid; grid-template-columns: repeat(auto-fit, minmax(70px,1fr)); gap:6px; }
.f .tip { font-size:11px; color:var(--muted); margin-top:2px; }
.colors { display:grid; grid-template-columns: repeat(auto-fill, minmax(96px,1fr)); gap:8px; }
.colors .f { margin:0; }
.colors input[type=color] { width:100%; height:30px; border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:2px; }
textarea { width:100%; min-height:300px; resize:vertical; font:12.5px/1.5 "SF Mono",Menlo,Consolas,monospace; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px; }
ol.steps { margin:0 0 10px; padding-left:18px; color:var(--muted); font-size:13px; }
ol.steps b { color:var(--ink); }
h2 { font-size:15px; margin:0 0 8px; }
</style>
</head>
<body>
<header><h1>十五画境工作台</h1><span>选一种风格 → 改文字和颜色 → 导出 MP4 · 画面来自开源项目 mg-styles-15（MIT）</span></header>
<div class="layout">
  <nav class="card"><div class="styles" id="styles"></div></nav>
  <main class="card">
    <div class="stage" id="stage"><iframe id="film" title="预览"></iframe><div class="veil" id="veil">加载中…</div></div>
    <div class="row">
      <button id="play" class="primary">▶ 播放</button>
      <input id="scrub" type="range" min="0" max="1000" value="0">
      <span class="time" id="time">0.0 / 10.0 秒</span>
    </div>
    <div class="row">
      <label>画质 <select id="quality"><option value="1">标准（快）</option><option value="0">原片画质（带动态模糊，慢）</option></select></label>
      <button id="export" class="primary">⬇ 导出 MP4（带配乐）</button>
    </div>
    <div class="bar" id="bar"><i id="barI"></i></div>
    <div class="msg" id="exmsg"></div>
    <p class="about" id="about"></p>
  </main>
  <aside class="card">
    <h2>改内容</h2>
    <ol class="steps">
      <li>点 <b>复制给AI的提示词</b>，发给豆包 / DeepSeek / Kimi 等任意 AI，写上你的需求。</li>
      <li>把 AI 回的那段 JSON 贴进「JSON」页，或者直接在「表单」里改。</li>
      <li>预览满意后点 <b>导出 MP4</b>。</li>
    </ol>
    <div class="row" style="margin-top:0;margin-bottom:10px"><button id="copy">复制给AI的提示词</button><button id="example">填入示例</button><button id="reset">恢复原片</button></div>
    <div class="tabs"><button id="tForm" class="on">表单</button><button id="tJson">JSON</button></div>
    <div id="form"></div>
    <div id="json" hidden><textarea id="jsonTA" spellcheck="false" placeholder="把 AI 回复的 JSON 整段贴到这里"></textarea></div>
    <div class="msg" id="cfgmsg"></div>
  </aside>
</div>
<script type="module">
import { STYLES, cleanCfg, promptFor } from './mp/styles.js';
import { Muxer, ArrayBufferTarget } from './mp/mp4-muxer.js';
const $ = id => document.getElementById(id);
const film = $('film'), stage = $('stage');
let cur = null, cfg = {}, T = 0, DUR = 10, FPS = 30, playing = false, last = 0, busy = false, loadTok = 0, audio = null;

// ---------- 风格列表
STYLES.forEach(s => { const b = document.createElement('button'); b.className = 'sty'; b.disabled = !s.ready; b.dataset.id = s.id;
  b.innerHTML = `<img src="covers/${s.id}.jpg" alt=""><span><b>${s.name}</b><small>${s.ready ? s.work : '制作中'}</small></span>`;
  b.onclick = () => pick(s.id); $('styles').appendChild(b); });
const fit = () => { const k = stage.clientWidth / 1920; film.style.transform = `scale(${k})`; };
new ResizeObserver(fit).observe(stage);

// ---------- 加载一支片（每次改配置都重新加载 iframe，片子只在启动时读配置）
function pick(id) { cur = STYLES.find(s => s.id === id); cfg = {}; [...$('styles').children].forEach(b => b.classList.toggle('on', b.dataset.id === id));
  $('about').textContent = cur.about; buildForm(); syncJson(); reload(); }
function reload() {
  const tok = ++loadTok; setPlay(false); $('veil').hidden = false; $('veil').textContent = '加载中…';
  film.src = `demos/${cur.id}/index.html?cfg=${encodeURIComponent(JSON.stringify(cfg))}`;
  audio = new Audio(`demos/${cur.id}/music.m4a`); audio.preload = 'auto';
  const t0 = performance.now();
  (function wait() { if (tok !== loadTok) return; const w = film.contentWindow;
    if (w && w.__ready && w.renderAt) { DUR = w.DEMO?.duration || 10; FPS = w.DEMO?.fps || 30; $('veil').hidden = true; draw(); return; }
    if (performance.now() - t0 > 30000) { $('veil').textContent = '加载失败：请确认是用「启动工作台」打开的，而不是直接双击网页'; return; }
    setTimeout(wait, 120); })();
}
async function draw() { const w = film.contentWindow; if (!w?.renderAt) return; await w.renderAt(Math.min(T, DUR - 1 / FPS));
  $('time').textContent = `${T.toFixed(1)} / ${DUR.toFixed(1)} 秒`; $('scrub').value = Math.round(T / DUR * 1000); }

// ---------- 播放
let drawing = false;
function tick(now) { if (!playing) return; T = audio && !audio.paused ? audio.currentTime : T + (now - last) / 1000; last = now;
  if (T >= DUR) { T = 0; setPlay(false); draw(); return; }
  if (!drawing) { drawing = true; draw().finally(() => drawing = false); } requestAnimationFrame(tick); }
function setPlay(on) { playing = on; $('play').textContent = on ? '❚❚ 暂停' : '▶ 播放';
  if (audio) { if (on) { audio.currentTime = T; audio.play().catch(() => {}); } else audio.pause(); }
  if (on) { last = performance.now(); requestAnimationFrame(tick); } }
$('play').onclick = () => { if (busy) return; setPlay(!playing); };
$('scrub').oninput = e => { if (busy) return; setPlay(false); T = e.target.value / 1000 * DUR; draw(); };

// ---------- 表单
function buildForm() {
  const box = $('form'); box.innerHTML = ''; const colors = document.createElement('div'); colors.className = 'colors';
  const W = () => { const { cfg: c } = cleanCfg(cur, readForm()); cfg = c; syncJson(); later(); };
  for (const f of cur.fields) {
    const d = document.createElement('div'); d.className = 'f';
    if (f.type === 'color') { d.innerHTML = `<label>${f.label}</label><input type="color" data-k="${f.key}">`; colors.appendChild(d); continue; }
    let inner = '';
    if (f.type === 'text') inner = `<input type="text" data-k="${f.key}" maxlength="${f.max * 2}">`;
    else if (f.type === 'list') inner = `<div class="multi">${Array.from({ length: f.n }, (_, i) => `<input type="text" data-k="${f.key}" data-i="${i}">`).join('')}</div>`;
    else if (f.type === 'pairs') inner = `<div class="multi">${Array.from({ length: f.n }, (_, i) => `<input type="text" data-k="${f.key}" data-i="${i}" data-j="0" placeholder="英文"><input type="text" data-k="${f.key}" data-i="${i}" data-j="1" placeholder="汉字">`).join('')}</div>`;
    else if (f.type === 'ui') inner = f.keys.map(([k, lab, mx, n]) => `<div class="f"><label>${lab}</label>${n ? `<div class="multi">${Array.from({ length: n }, (_, i) => `<input type="text" data-k="${f.key}" data-u="${k}" data-i="${i}">`).join('')}</div>` : `<input type="text" data-k="${f.key}" data-u="${k}">`}</div>`).join('');
    d.innerHTML = `<label>${f.label}</label>${inner}${f.tip ? `<div class="tip">${f.tip}</div>` : ''}`; box.appendChild(d);
  }
  if (colors.children.length) { const h = document.createElement('div'); h.className = 'f'; h.innerHTML = '<label>颜色（不改就用原片配色）</label>'; box.appendChild(h); box.appendChild(colors); }
  box.querySelectorAll('input').forEach(i => i.addEventListener(i.type === 'color' ? 'change' : 'input', W));
  fillForm();
}
function readForm() { const o = {}; $('form').querySelectorAll('input').forEach(i => { const k = i.dataset.k, f = cur.fields.find(x => x.key === k), v = i.value;
    if (f.type === 'color') { if (i.dataset.touched || cfg[k]) o[k] = v; return; }
    if (f.type === 'text') { if (v) o[k] = v; return; }
    if (f.type === 'list') { (o[k] ||= Array(f.n).fill(''))[+i.dataset.i] = v; return; }
    if (f.type === 'pairs') { (o[k] ||= Array.from({ length: f.n }, () => ['', '']))[+i.dataset.i][+i.dataset.j] = v; return; }
    if (f.type === 'ui') { o[k] ||= {}; const u = i.dataset.u, n = f.keys.find(x => x[0] === u)[3]; if (n) (o[k][u] ||= Array(n).fill(''))[+i.dataset.i] = v; else if (v) o[k][u] = v; } });
  for (const f of cur.fields) { if (f.type === 'list' && o[f.key]?.every(x => !x)) delete o[f.key]; if (f.type === 'pairs' && o[f.key]?.every(p => !p[0] && !p[1])) delete o[f.key];
    if (f.type === 'ui' && o[f.key]) { for (const u in o[f.key]) if (Array.isArray(o[f.key][u]) && o[f.key][u].every(x => !x)) delete o[f.key][u]; } }
  return o; }
function fillForm() { $('form').querySelectorAll('input').forEach(i => { const k = i.dataset.k, f = cur.fields.find(x => x.key === k), v = cfg[k];
  if (f.type === 'color') { i.value = v || '#888888'; i.oninput = () => i.dataset.touched = 1; return; }
  if (f.type === 'text') i.value = v || '';
  else if (f.type === 'list') i.value = v?.[+i.dataset.i] || '';
  else if (f.type === 'pairs') i.value = v?.[+i.dataset.i]?.[+i.dataset.j] || '';
  else if (f.type === 'ui') { const u = v?.[i.dataset.u]; i.value = Array.isArray(u) ? u[+i.dataset.i] || '' : u || ''; } }); }
let tm; const later = () => { clearTimeout(tm); tm = setTimeout(reload, 700); };

// ---------- JSON（贴 AI 的回复）
function syncJson() { if (document.activeElement !== $('jsonTA')) $('jsonTA').value = JSON.stringify(cfg, null, 2); }
function parseLoose(text) { let s = String(text).replace(/```[a-zA-Z]*\n?/g, '').replace(/```/g, ''); const a = s.indexOf('{'), b = s.lastIndexOf('}'); if (a >= 0 && b > a) s = s.slice(a, b + 1);
  try { return [JSON.parse(s), false]; } catch (e) {}
  const f = s.replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/"\s*：/g, '":').replace(/,(\s*[}\]])/g, '$1');
  return [JSON.parse(f), true]; }
$('jsonTA').addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => {
  const m = $('cfgmsg'); try { const [raw, fixed] = parseLoose($('jsonTA').value); const { cfg: c, warn } = cleanCfg(cur, raw); cfg = c; fillForm();
    m.className = 'msg ' + (warn.length || fixed ? 'warn' : 'ok'); m.textContent = (fixed ? '· 格式有小问题（中文引号、多余逗号），已自动修正\n' : '') + warn.map(w => '· ' + w).join('\n') + (warn.length || fixed ? '\n' : '') + '已应用';
    reload(); } catch (e) { m.className = 'msg err'; m.textContent = '看不懂这段内容，请让 AI 只输出一段 JSON。'; } }, 600); });
$('tForm').onclick = () => { $('form').hidden = false; $('json').hidden = true; $('tForm').classList.add('on'); $('tJson').classList.remove('on'); };
$('tJson').onclick = () => { $('form').hidden = true; $('json').hidden = false; $('tJson').classList.add('on'); $('tForm').classList.remove('on'); syncJson(); };
$('copy').onclick = async () => { const p = promptFor(cur); try { await navigator.clipboard.writeText(p); $('copy').textContent = '已复制 ✓'; } catch (e) { $('tJson').onclick(); $('jsonTA').value = p; $('copy').textContent = '复制失败，已放进 JSON 框里'; } setTimeout(() => $('copy').textContent = '复制给AI的提示词', 2500); };
$('example').onclick = () => { cfg = cleanCfg(cur, cur.example).cfg; fillForm(); syncJson(); reload(); };
$('reset').onclick = () => { cfg = {}; fillForm(); syncJson(); reload(); };

// ---------- 导出：逐帧渲染 → WebCodecs 编码 H.264 + AAC → MP4（不依赖电脑快慢，帧不会丢）
async function frameSource(w) {
  const d = w.document, cv = d.querySelector('canvas#out, canvas#gl, canvas#c');
  if (cv) return () => cv;
  const svg = d.querySelector('svg'); if (!svg) throw new Error('找不到画面');
  // SVG 片子：把字体内嵌后栅格化
  const css = await (await fetch('assets/fonts/fonts.css')).text(); let inl = css;
  for (const m of css.matchAll(/url\('([^']+)'\)/g)) { try { const r = await fetch('assets/fonts/' + m[1]); if (!r.ok) continue; const b = await r.blob();
    const u = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); }); inl = inl.split(m[1]).join(u); } catch (e) {} }
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; const x = c.getContext('2d');
  return async () => { const cl = svg.cloneNode(true); const st = document.createElementNS('http://www.w3.org/2000/svg', 'style'); st.textContent = inl; cl.insertBefore(st, cl.firstChild);
    cl.setAttribute('width', 1920); cl.setAttribute('height', 1080);
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(cl)], { type: 'image/svg+xml' }));
    const img = new Image(); img.src = url; await img.decode(); x.fillStyle = getComputedStyle(d.body).backgroundColor || '#000'; x.fillRect(0, 0, 1920, 1080); x.drawImage(img, 0, 0, 1920, 1080); URL.revokeObjectURL(url); return c; };
}
async function pickCodec(w, h, fps) { for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42e028', 'avc1.42003e']) { const c = { codec, width: w, height: h, bitrate: 14e6, framerate: fps };
  try { if ((await VideoEncoder.isConfigSupported(c)).supported) return c; } catch (e) {} } return null; }
$('export').onclick = async () => {
  if (busy || !cur) return; const msg = $('exmsg');
  if (!('VideoEncoder' in window)) { msg.className = 'msg err'; msg.textContent = '这个浏览器不支持导出。请用最新版 Chrome 或 Edge 打开。'; return; }
  busy = true; setPlay(false); $('export').disabled = true; $('bar').classList.add('on'); msg.className = 'msg'; msg.textContent = '正在导出，可以切到别的窗口，但不要关掉这个页面…';
  try {
    const w = film.contentWindow, N = Math.round(DUR * FPS), MB = $('quality').value === '0' ? Math.max(1, w.DEMO?.motionBlur?.samples || 1) : 1, SH = w.DEMO?.motionBlur?.shutter ?? .5;
    const grab = await frameSource(w), vc = await pickCodec(1920, 1080, FPS); if (!vc) throw new Error('浏览器不支持 H.264 编码');
    // 配乐
    let ab = null; try { const ac = new OfflineAudioContext(2, 48000 * DUR, 48000); ab = await ac.decodeAudioData(await (await fetch(`demos/${cur.id}/music.m4a`)).arrayBuffer()); } catch (e) { ab = null; }
    const canAudio = ab && 'AudioEncoder' in window && (await AudioEncoder.isConfigSupported({ codec: 'mp4a.40.2', sampleRate: ab.sampleRate, numberOfChannels: 2, bitrate: 192000 }).catch(() => ({}))).supported;
    const muxer = new Muxer({ target: new ArrayBufferTarget(), fastStart: 'in-memory', video: { codec: 'avc', width: 1920, height: 1080, frameRate: FPS }, ...(canAudio ? { audio: { codec: 'aac', sampleRate: ab.sampleRate, numberOfChannels: 2 } } : {}) });
    let err = null; const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => err = e }); venc.configure(vc);
    const acc = document.createElement('canvas'); acc.width = 1920; acc.height = 1080; const ax = acc.getContext('2d');
    for (let i = 0; i < N; i++) {
      if (err) throw err;
      for (let j = 0; j < MB; j++) { const t = MB > 1 ? (i + (j + .5) / MB * SH - SH / 2 + .5) / FPS : i / FPS;
        await w.renderAt(Math.max(0, Math.min(DUR - 1e-3, t))); const src = await grab(); ax.globalAlpha = 1 / (j + 1); ax.drawImage(src, 0, 0, 1920, 1080); }
      ax.globalAlpha = 1; const vf = new VideoFrame(acc, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      venc.encode(vf, { keyFrame: i % (FPS * 2) === 0 }); vf.close();
      while (venc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 5));
      if (i % 3 === 0) { $('barI').style.width = (i / N * 92) + '%'; await new Promise(r => setTimeout(r, 0)); }
    }
    await venc.flush();
    if (canAudio) { const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => err = e });
      aenc.configure({ codec: 'mp4a.40.2', sampleRate: ab.sampleRate, numberOfChannels: 2, bitrate: 192000 });
      const L = ab.getChannelData(0), R = ab.numberOfChannels > 1 ? ab.getChannelData(1) : L, total = Math.min(ab.length, Math.round(DUR * ab.sampleRate)), step = 4096;
      for (let o = 0; o < total; o += step) { const n = Math.min(step, total - o), buf = new Float32Array(n * 2); buf.set(L.subarray(o, o + n), 0); buf.set(R.subarray(o, o + n), n);
        const ad = new AudioData({ format: 'f32-planar', sampleRate: ab.sampleRate, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(o / ab.sampleRate * 1e6), data: buf }); aenc.encode(ad); ad.close(); }
      await aenc.flush(); }
    if (err) throw err;
    muxer.finalize(); const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `十五画境_${cur.name}_${new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '')}.mp4`; a.click();
    $('barI').style.width = '100%'; msg.className = 'msg ok'; msg.textContent = `已下载 MP4（${(blob.size / 1048576).toFixed(1)} MB，1920×1080，${FPS}fps，${DUR} 秒${canAudio ? '，带配乐' : '，这个浏览器不支持音频编码，没有配乐'}）`;
    window.__lastExport = { size: blob.size, frames: N, audio: !!canAudio }; window.__lastBlob = blob;
  } catch (e) { msg.className = 'msg err'; msg.textContent = '导出失败：' + (e.message || e); window.__lastExport = { error: String(e.message || e) }; }
  busy = false; $('export').disabled = false; T = 0; draw();
};

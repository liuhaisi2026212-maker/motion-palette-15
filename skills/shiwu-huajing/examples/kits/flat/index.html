<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>扁平矢量 · 十五画境参考例子</title>
<style>
@font-face { font-family: 'Fredoka'; src: url('../../assets/fonts/Fredoka-VF.ttf') format('truetype'); font-weight: 300 700; font-display: block; }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; width: 1920px; height: 1080px; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { boot, readSpec } from '../../lib/core.js';
import { buildFilm } from './kit.js';
import { EXAMPLE } from './example.js';
const spec = readSpec(EXAMPLE);
await boot({ width: 1920, height: 1080, fps: 30, fonts: [['700 100px "Fredoka"', 'Aa0123'], ['900 100px "PingFang SC"', JSON.stringify(spec)]] },
  async () => buildFilm(spec, document.getElementById('c')));
</script></body></html>
